<div id="world"><div class="bg"></div><div class="mountain" style="left:5%"></div><div class="mountain" style="left:42%;height:38%"></div><div id="objects"></div><div id="mei"><div class="head"><div class="hair"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div><div class="body"></div></div></div>
<div id="hud" class="hidden"><span>👶 MEI × <b id="lives">3</b></span><span>🪙 <b id="coins">0</b>　🍼 <b id="milk">0</b></span><span id="levelText"></span><span>SCORE <b id="score">000000</b></span></div>
<div id="menu" class="screen"><div class="panel"><h1>MEI'S<br>ADVENTURES</h1><p>Drei echte Jump-&-Run-Levels</p><button class="start" id="play">▶ SPIEL STARTEN</button><div class="levels"><button data-level="0">1 · Blumenwiese</button><button data-level="1">2 · Wolkenland</button><button data-level="2">3 · Schlossgarten</button></div></div></div>
<div id="end" class="screen hidden"><div class="dialog"><h2 id="endTitle"></h2><p id="endText"></p><button class="start" id="next">WEITER ▶</button><button id="home" style="width:100%;margin-top:8px">HAUPTMENÜ</button></div></div>

<script>
(function(){
var game=document.getElementById("game"),objects=document.getElementById("objects"),mei=document.getElementById("mei"),menu=document.getElementById("menu"),end=document.getElementById("end"),hud=document.getElementById("hud");
var key={left:false,right:false,down:false,jump:false}, mode="menu", level=0, x=120,y=330,vy=0,onGround=false,camera=0,lives=3,score=0,milk=0,inv=0,last=performance.now(),worldW=5000;
var platforms=[],coins=[],bottles=[],enemies=[],goal=0;
var configs=[
{name:"LEVEL 1-1 · BLUMENWIESE",w:5200,gaps:[[1050,125],[2380,150],[3650,130]]},
{name:"LEVEL 2-1 · WOLKENLAND",w:6400,gaps:[[850,150],[1800,160],[3100,180],[4450,150],[5400,140]]},
{name:"LEVEL 3-1 · SCHLOSSGARTEN",w:7600,gaps:[[1150,160],[2200,170],[3450,160],[4700,190],[6100,170]]}
];
function el(cls,left,top,w,h){var d=document.createElement("div");d.className=cls;d.style.left=left+"px";d.style.top=top+"px";if(w)d.style.width=w+"px";if(h)d.style.height=h+"px";objects.appendChild(d);return d}
function build(n){
 level=n;var cfg=configs[n];worldW=cfg.w;objects.innerHTML="";platforms=[];coins=[];bottles=[];enemies=[];goal=worldW-170;
 var cursor=0;cfg.gaps.forEach(function(g){if(g[0]>cursor){platforms.push({x:cursor,y:460,w:g[0]-cursor,h:80,el:el("ground",cursor,460,g[0]-cursor,80)});cursor=g[0]+g[1]}});platforms.push({x:cursor,y:460,w:worldW-cursor,h:80,el:el("ground",cursor,460,worldW-cursor,80)});
 for(var px=520,i=0;px<worldW-400;px+=520,i++){var py=350-(i%3)*55;platforms.push({x:px,y:py,w:180,h:25,el:el("platform",px,py,180,25)});if(i%4===1)platforms.push({x:px+230,y:py-100,w:130,h:25,el:el("platform",px+230,py-100,130,25)})}
 for(var cx=300,j=0;cx<worldW-250;cx+=180,j++){var ce=el("coin",cx,315-(j%3)*45,22,30);coins.push({x:cx,y:315-(j%3)*45,w:22,h:30,got:false,el:ce})}
 for(var bx=900,k=0;bx<worldW-300;bx+=1250,k++){var be=el("bottle",bx,270-(k%2)*55,24,42);bottles.push({x:bx,y:270-(k%2)*55,w:24,h:42,got:false,el:be})}
 for(var ex=700,m=0;ex<worldW-350;ex+=620,m++){var ee=el("needle",ex,410,58,18);enemies.push({x:ex,y:410,w:58,h:18,v:m%2?70:-70,min:ex-120,max:ex+120,dead:false,el:ee})}
 var pole=el("flagpole",goal,250,7,210);var fl=document.createElement("div");fl.className="flag";pole.appendChild(fl);
 x=120;y=330;vy=0;camera=0;lives=3;score=0;milk=0;inv=0;mode="play";menu.classList.add("hidden");end.classList.add("hidden");hud.classList.remove("hidden");sync();render();
}
function sync(){document.getElementById("lives").textContent=lives;document.getElementById("coins").textContent=coins.filter(function(c){return c.got}).length;document.getElementById("milk").textContent=milk;document.getElementById("score").textContent=("000000"+score).slice(-6);document.getElementById("levelText").textContent=configs[level].name}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function damage(){if(inv>0)return;inv=1.2;lives--;sync();if(lives<=0){mode="end";finish(false)}else{x=Math.max(40,x-180);y=300;vy=-120}}
function finish(win){end.classList.remove("hidden");document.getElementById("endTitle").textContent=win?"GESCHAFFT! 🎉":"GAME OVER";document.getElementById("endText").textContent=win?configs[level].name+" geschafft! Score: "+score:"Mei wurde von einer Spritze erwischt.";document.getElementById("next").dataset.win=win?"1":"0";document.getElementById("next").textContent=win&&level<2?"NÄCHSTES LEVEL ▶":"NOCHMAL SPIELEN ↻"}
function update(dt){
 if(mode!=="play")return;inv=Math.max(0,inv-dt);
 var h=key.down&&onGround?50:76;var oldY=y;var dx=((key.right?1:0)-(key.left?1:0))*320*dt;x=Math.max(0,Math.min(worldW-54,x+dx));
 if(key.jump&&onGround&&!key.down){vy=-680;onGround=false;key.jump=false}
 vy+=1650*dt;y+=vy*dt;onGround=false;
 for(var i=0;i<platforms.length;i++){var p=platforms[i];if(x+54>p.x&&x<p.x+p.w&&oldY+h<=p.y+10&&y+h>=p.y&&vy>=0){y=p.y-h;vy=0;onGround=true}}
 if(y>560){damage();y=280}
 var me={x:x,y:y,w:54,h:h};
 coins.forEach(function(c){if(!c.got&&hit(me,c)){c.got=true;c.el.style.display="none";score+=100;sync()}});
 bottles.forEach(function(b){if(!b.got&&hit(me,b)){b.got=true;b.el.style.display="none";milk++;score+=500;if(lives<3)lives++;sync()}});
 enemies.forEach(function(e){if(e.dead)return;e.x+=e.v*dt;if(e.x<e.min||e.x>e.max)e.v=-e.v;e.el.style.left=e.x+"px";if(hit(me,e)){if(vy>100&&y+h<e.y+12){e.dead=true;e.el.style.display="none";vy=-360;score+=300;sync()}else damage()}});
 if(x>goal-40){score+=2000;sync();mode="end";finish(true)}
 camera=Math.max(0,Math.min(worldW-960,x-300));render();
}
function render(){objects.style.transform="translateX("+(-camera)+"px)";mei.style.left=(x-camera)+"px";mei.style.top=y+"px";mei.style.height=(key.down&&onGround?50:76)+"px";mei.style.opacity=(inv>0&&Math.floor(inv*12)%2===0)?"0.25":"1";mei.style.transform=key.left&&!key.right?"scaleX(-1)":"scaleX(1)"}
function loop(now){var dt=Math.min(.03,(now-last)/1000);last=now;update(dt);requestAnimationFrame(loop)}
document.getElementById("play").onclick=function(){build(0)};document.querySelectorAll("[data-level]").forEach(function(b){b.onclick=function(){build(parseInt(b.dataset.level,10))}});
document.getElementById("next").onclick=function(){var win=this.dataset.win==="1";build(win&&level<2?level+1:level)};document.getElementById("home").onclick=function(){mode="menu";end.classList.add("hidden");hud.classList.add("hidden");menu.classList.remove("hidden")};
function mapKey(k){if(k==="ArrowLeft"||k==="a")return"left";if(k==="ArrowRight"||k==="d")return"right";if(k==="ArrowDown"||k==="s")return"down";if(k==="ArrowUp"||k==="w"||k===" ")return"jump";return null}
window.addEventListener("keydown",function(e){var k=mapKey(e.key);if(k){e.preventDefault();key[k]=true}});
window.addEventListener("keyup",function(e){var k=mapKey(e.key);if(k){e.preventDefault();key[k]=false}});
document.querySelectorAll(".ctrl").forEach(function(b){var k=b.dataset.key;function on(e){e.preventDefault();key[k]=true}function off(e){e.preventDefault();key[k]=false}b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false})});
requestAnimationFrame(loop);
})();
</script></body></html>
